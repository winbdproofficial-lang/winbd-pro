<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WINBD-PRO Admin</title><link rel="icon" href="/logo.svg"><link rel="stylesheet" href="/styles.css"><style>.admin{max-width:1180px;margin:auto;padding:32px 20px}.adminGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.panel{background:#11182a;border:1px solid #26314a;border-radius:18px;padding:20px}.panel h3{margin-top:0}.muted{color:#8995aa}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid #26314a;text-align:left}@media(max-width:800px){.adminGrid{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><img src="/logo.svg"><span>WINBD-PRO</span></a><div class="actions"><button id="logout" class="ghost">Logout</button></div></header><main class="admin"><div class="pill">● ADMIN DASHBOARD</div><h1>WINBD-PRO Control Center</h1><p id="status" class="muted">Checking account...</p><div class="adminGrid"><section class="panel"><h3>Users</h3><strong id="users">—</strong><p class="muted">Registered profiles</p></section><section class="panel"><h3>Games</h3><strong id="games">—</strong><p class="muted">Configured games</p></section><section class="panel"><h3>Categories</h3><strong id="categories">—</strong><p class="muted">Active categories</p></section></div><section class="panel" style="margin-top:16px"><h3>Recent activity</h3><table class="table"><thead><tr><th>Action</th><th>User</th><th>Time</th></tr></thead><tbody id="activity"><tr><td colspan="3" class="muted">Loading...</td></tr></tbody></table></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase.js"></script><script>
const statusEl=document.getElementById('status');
async function init(){const {data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href='/';return}const {data:me}=await supabaseClient.from('profiles').select('role,display_name,username').eq('id',session.user.id).maybeSingle();if(me?.role!=='admin'){statusEl.textContent='Admin permission required.';document.body.innerHTML='<main class="admin"><h1>Access denied</h1><p class="muted">এই page শুধু admin role-এর জন্য।</p><a class="primary" href="/">ফিরে যান</a></main>';return}statusEl.textContent=`Signed in as ${me.display_name||me.username||session.user.email}`;const [{count:u},{count:g},{count:c},{data:a}]=await Promise.all([supabaseClient.from('profiles').select('*',{count:'exact',head:true}),supabaseClient.from('games').select('*',{count:'exact',head:true}),supabaseClient.from('game_categories').select('*',{count:'exact',head:true}),supabaseClient.from('activity_log').select('action,user_id,created_at').order('created_at',{ascending:false}).limit(10)]);document.getElementById('users').textContent=u??0;document.getElementById('games').textContent=g??0;document.getElementById('categories').textContent=c??0;document.getElementById('activity').innerHTML=(a||[]).map(x=>`<tr><td>${x.action}</td><td>${x.user_id||'—'}</td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">No activity</td></tr>'}
document.getElementById('logout').onclick=async()=>{await supabaseClient.auth.signOut();location.href='/'};init();</script></body></html>
