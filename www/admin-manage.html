<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WINBD-PRO Management</title><link rel="icon" href="/logo.svg"><link rel="stylesheet" href="/styles.css"><style>.admin{max-width:1200px;margin:auto;padding:28px 20px}.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#11182a;border:1px solid #26314a;border-radius:18px;padding:20px;margin-top:16px}.panel h2,.panel h3{margin-top:0}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formGrid textarea{grid-column:1/-1;min-height:70px}.formGrid button{grid-column:1/-1}.input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #2b3855;background:#0b1020;color:#fff}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid #26314a;text-align:left}.danger{background:#5d2630;color:#fff;border:0;border-radius:8px;padding:8px}.muted{color:#8995aa}.hidden{display:none!important}@media(max-width:800px){.adminGrid,.formGrid{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="/"><img src="/logo.svg"><span>WINBD-PRO</span></a><div class="actions"><a class="ghost" href="/admin.html">Dashboard</a><button id="logout" class="ghost">Logout</button></div></header><main class="admin"><div class="pill">● ADMIN MANAGEMENT</div><h1>Games & Categories</h1><p id="status" class="muted">Checking account...</p><div id="toast" class="panel hidden"></div><div class="adminGrid"><section class="panel"><h3>Add category</h3><form id="catForm" class="formGrid"><input class="input" name="name" placeholder="Category name" required><input class="input" name="slug" placeholder="slug" required><textarea class="input" name="description" placeholder="Description"></textarea><button class="primary">Add category</button></form></section><section class="panel"><h3>Add game</h3><form id="gameForm" class="formGrid"><input class="input" name="name" placeholder="Game name" required><input class="input" name="slug" placeholder="slug" required><input class="input" name="provider" placeholder="Provider"><select class="input" name="category_id" id="gameCat"></select><textarea class="input" name="description" placeholder="Description"></textarea><button class="primary">Add game</button></form></section></div><section class="panel"><h3>Categories</h3><div style="overflow:auto"><table class="table"><thead><tr><th>Name</th><th>Slug</th><th>Status</th><th>Action</th></tr></thead><tbody id="catsBody"></tbody></table></div></section><section class="panel"><h3>Games</h3><div style="overflow:auto"><table class="table"><thead><tr><th>Name</th><th>Slug</th><th>Provider</th><th>Category</th><th>Status</th><th>Action</th></tr></thead><tbody id="gamesBody"></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase.js"></script><script src="/admin.js"></script></body></html>
