<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>WINBD-PRO Wallet</title><link rel="icon" href="/logo.svg"><link rel="stylesheet" href="/styles.css"><style>.wrap{max-width:980px;margin:auto;padding:32px 20px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.panel{background:#11182a;border:1px solid #26314a;border-radius:18px;padding:20px}.panel h2{margin-top:0}.muted{color:#8995aa}.form{display:grid;gap:10px}.form input,.form select,.form textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #26314a;background:#0b1020;color:inherit}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid #26314a;text-align:left}.badge{padding:4px 8px;border-radius:999px;background:#26314a}.notice{margin:16px 0;padding:12px;border-radius:12px;background:#171f34;color:#aeb9cb}@media(max-width:760px){.cards{grid-template-columns:1fr}.table{font-size:13px}}</style></head>
<body><header class="topbar"><a class="brand" href="/"><img src="/logo.svg"><span>WINBD-PRO</span></a><div class="actions"><a class="ghost" href="/">হোম</a><button id="logout" class="ghost">Logout</button></div></header>
<main class="wrap"><div class="pill">● DEMO WALLET</div><h1>Wallet Center</h1><p id="status" class="muted">Loading...</p><div class="notice">এই wallet শুধুমাত্র <b>virtual/demo credits</b>-এর জন্য। এখানে কোনো real-money payment বা cash-out হয় না।</div><div class="cards"><section class="panel"><h2>বর্তমান ব্যালেন্স</h2><div style="font-size:34px;font-weight:800" id="balance">৳ 0.00</div><p class="muted">Virtual credits</p></section><section class="panel"><h2>Request</h2><form class="form" id="requestForm"><select id="type"><option value="demo_credit">Demo credit request</option><option value="demo_debit">Demo withdrawal request</option></select><input id="amount" type="number" min="1" step="0.01" placeholder="Amount"><textarea id="note" rows="3" placeholder="Note (optional)"></textarea><button class="primary" type="submit">Request submit</button></form><p id="msg" class="muted"></p></section></div><section class="panel" style="margin-top:16px"><h2>আমার requests</h2><table class="table"><thead><tr><th>Type</th><th>Amount</th><th>Status</th><th>Time</th></tr></thead><tbody id="requests"></tbody></table></section><section class="panel" style="margin-top:16px"><h2>Wallet ledger</h2><table class="table"><thead><tr><th>Reason</th><th>Amount</th><th>Balance</th><th>Time</th></tr></thead><tbody id="ledger"></tbody></table></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase.js"></script><script>
const $=id=>document.getElementById(id);let uid;
async function init(){const {data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href='/';return}uid=session.user.id;const {data:p}=await supabaseClient.from('profiles').select('display_name,username').eq('id',uid).maybeSingle();$('status').textContent=`Signed in as ${p?.display_name||p?.username||session.user.email}`;await refresh()}
async function refresh(){const {data:w}=await supabaseClient.from('wallets').select('demo_balance').eq('user_id',uid).maybeSingle();$('balance').textContent=`৳ ${Number(w?.demo_balance||0).toFixed(2)}`;const {data:r}=await supabaseClient.from('admin_requests').select('request_type,amount,status,created_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(50);$('requests').innerHTML=(r||[]).map(x=>`<tr><td>${x.request_type==='demo_credit'?'Credit':'Demo withdrawal'}</td><td>৳ ${Number(x.amount).toFixed(2)}</td><td><span class="badge">${x.status}</span></td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No requests</td></tr>';const {data:l}=await supabaseClient.from('wallet_ledger').select('reason,amount,balance_after,created_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(50);$('ledger').innerHTML=(l||[]).map(x=>`<tr><td>${x.reason}</td><td>${Number(x.amount).toFixed(2)}</td><td>${Number(x.balance_after).toFixed(2)}</td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No ledger entries</td></tr>'}
$('requestForm').onsubmit=async e=>{e.preventDefault();$('msg').textContent='Submitting...';const amount=Number($('amount').value);if(!amount||amount<=0){$('msg').textContent='Valid amount দিন।';return}const {error}=await supabaseClient.from('admin_requests').insert({user_id:uid,request_type:$('type').value,amount,note:$('note').value.trim()||null});$('msg').textContent=error?error.message:'Request submitted successfully.';if(!error){$('amount').value='';$('note').value='';await refresh()}};
$('logout').onclick=async()=>{await supabaseClient.auth.signOut();location.href='/'};init();
</script></body></html>
